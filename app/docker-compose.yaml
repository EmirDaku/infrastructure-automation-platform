version: "3.9"

services:
  dotnetapp:
    image: ghcr.io/emirdaku/infrastructure-automation-platform/dotnetapp:8.0
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - dotnetapp_database
    restart: unless-stopped

  dotnetapp_database:
    image: postgres:13
    container_name: dotnetapp-db
    env_file:
      - .env
    volumes:
      - dotnetapp-db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d 
    ports:
      - "5432:5432"
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-oss:12.1.1
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  dotnetapp-db-data:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

